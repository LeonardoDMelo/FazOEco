# Produção — VPS ~2GB RAM. Uso:
#   docker compose -f infra/compose.prod.yaml --env-file .env.prod up -d --build
name: fazoeeco-prod

services:
  db:
    image: postgres:16-alpine
    container_name: fazoeeco-db
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    container_name: fazoeeco-backend
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      SECRET_KEY: ${SECRET_KEY}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10/minute}
      RATE_LIMIT_SEARCH: ${RATE_LIMIT_SEARCH:-120/minute}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ENABLE_SIMULATION_MODE: ${ENABLE_SIMULATION_MODE:-false}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # Sem bind de porta pública — apenas via nginx
    expose:
      - "8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        API_URL: http://backend:8000
    container_name: fazoeeco-frontend
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      API_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - internal
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: fazoeeco-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - internal
      - edge

  certbot:
    image: certbot/certbot:latest
    container_name: fazoeeco-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    networks:
      - edge

volumes:
  postgres_data:
  certbot_www:
  certbot_certs:

networks:
  internal:
    driver: bridge
  edge:
    driver: bridge
